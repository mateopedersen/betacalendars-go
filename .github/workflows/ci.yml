name: Go CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', '1.26.x', '1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Smoke check package documentation
        shell: bash
        run: |
          go doc . >/dev/null
          go doc ./grid >/dev/null
          go doc ./recurrence >/dev/null
          go doc ./boundary >/dev/null
          go doc ./fixtures >/dev/null
          go doc ./yearturn >/dev/null
          go doc ./cmd/betacal >/dev/null
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Fuzz smoke
        if: runner.os == 'Linux' && matrix.go == '1.27.x'
        run: go test -run '^$' -fuzz '^FuzzDateRoundTrip$' -fuzztime=3s .
      - name: Build CLI
        run: go build -o betacal ./cmd/betacal
