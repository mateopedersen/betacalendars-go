name: GitHub Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - run: go test ./...
      - run: go build -o betacal ./cmd/betacal
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: betacal
